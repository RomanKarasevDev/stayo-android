name: Android SDK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: test -d "$ANDROID_HOME/platforms/android-35"
      - run: ./gradlew --no-daemon --max-workers=2 :library:testDebugUnitTest :library:assembleRelease :sample:assembleDebug :library:assembleDebugAndroidTest :library:publishReleasePublicationToLocalBuildRepository
      - run: ./gradlew --no-daemon --max-workers=2 :sample:assembleDebug -PstayoPackaged
